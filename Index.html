<!DOCTYPE html>
<html>
<head>
    <title>AI Career Path Visualizer</title>
</head>
<body>

<h1>AI Career Path Visualizer for Students</h1>

<label>Enter your interest:</label>
<input type="text" id="interest">
<button onclick="showCareer()">Get Career Path</button>

<p id="result"></p>

<script>
function showCareer() {
    let interest = document.getElementById("interest").value;

    if (interest.toLowerCase() == "programming") {
        document.getElementById("result").innerHTML =
        "Suggested Career: Software Engineer";
    }
    else if (interest.toLowerCase() == "electronics") {
        document.getElementById("result").innerHTML =
        "Suggested Career: Electronics Engineer";
    }
    else {
        document.getElementById("result").innerHTML =
        "Suggested Career: " + interest;
    }
}
</script>

</body>
</html>
